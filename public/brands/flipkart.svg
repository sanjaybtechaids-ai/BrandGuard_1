<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <rect width="120" height="120" rx="26" fill="#2874F0"/>
  <!-- Flipkart Yellow Bag -->
  <g transform="translate(60, 52)">
    <!-- Bag Handle -->
    <path d="M-10 -18 C-10 -26, 10 -26, 10 -18" fill="none" stroke="#FFE11B" stroke-width="4" stroke-linecap="round"/>
    <!-- Bag Body -->
    <path d="M-22 -14 L22 -14 L18 26 L-18 26 Z" fill="#FFE11B" rx="3"/>
    <!-- Speed Lines on top left -->
    <path d="M-24 -4 L-20 -4" stroke="#FFE11B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-26 4 L-21 4" stroke="#FFE11B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- The iconic blue italic 'f' cut -->
    <text x="0" y="16" fill="#2874F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-style="italic" font-weight="900" text-anchor="middle">f</text>
  </g>
  <text x="60" y="102" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-style="italic" font-weight="800" letter-spacing="1" text-anchor="middle">Flipkart</text>
</svg>
